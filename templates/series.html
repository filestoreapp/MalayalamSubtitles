<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Season {{ season }} Subtitles</title>
    <meta property="og:title" content="📺 Download {{ title }} - Season {{ season }}">
    <meta property="og:description" content="Get subtitles for all episodes in Season {{ season }} of {{ title }}.">
    <meta property="og:image" content="{{ show_data.poster_url }}">
    
    <style>
        body { font-family: Arial, sans-serif; background: #141414; color: white; margin: 0; padding: 0; }
        .navbar { background: #000; padding: 15px 20px; display: flex; align-items: center; position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid #333; }
        .navbar a { color: white; text-decoration: none; font-weight: bold; }
        .home-btn { background: #e50914; padding: 8px 15px; border-radius: 5px; }
        
        .container { padding: 20px; max-width: 800px; margin: auto; text-align: center; }
        .poster { width: 100%; max-width: 250px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        
        /* Episode List Styling */
        .ep-list { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; text-align: left; }
        .ep-card { background: #222; padding: 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #e50914; text-decoration: none; color: white; transition: background 0.2s;}
        .ep-card:hover { background: #333; }
        .ep-num { font-size: 1.2rem; font-weight: bold; color: #e50914; width: 50px; }
        .ep-title { flex: 1; font-weight: bold; }
        .ep-btn { background: #444; padding: 8px 15px; border-radius: 4px; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="home-btn">🏠 Home</a>
    </div>

    <div class="container">
        <h1>{{ title }}</h1>
        <h2 style="color: #aaa; margin-top: -10px;">Season {{ season }}</h2>
        
        <img src="{{ show_data.poster_url }}" alt="Poster" class="poster" loading="lazy">
        
        <p style="color: #aaa;">⭐ {{ show_data.rating }} | 🍿 {{ show_data.category }}</p>

        <div class="ep-list">
            <h3 style="border-bottom: 1px solid #333; padding-bottom: 10px;">All Episodes</h3>
            
            {% for ep in episodes %}
            <a href="/movie/{{ ep.id }}" class="ep-card">
                <div class="ep-num">E{{ ep.episode }}</div>
                <div class="ep-title">{{ title }}</div>
                <div class="ep-btn">Get Subs &rarr;</div>
            </a>
            {% endfor %}
        </div>
    </div>
</body>
</html>
