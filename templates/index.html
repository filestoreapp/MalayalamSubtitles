<!DOCTYPE html>
<html lang="en">
<head>
    <title>Subtitle Download Hub</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 0; margin: 0; background: #121212; color: #fff;}
        .header-bg { background: #1f1f1f; padding: 40px 20px; border-bottom: 1px solid #333; }
        .search-box { margin: 20px auto; max-width: 600px; display: flex; }
        input[type="text"] { flex-grow: 1; padding: 15px; font-size: 16px; border: none; border-radius: 30px 0 0 30px; outline: none; background: #333; color: white;}
        button { padding: 15px 30px; font-size: 16px; background: #ff5722; color: white; border: none; border-radius: 0 30px 30px 0; cursor: pointer; font-weight: bold;}
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 25px; }
        .movie-card { background: #1f1f1f; border-radius: 10px; overflow: hidden; text-decoration: none; color: white; text-align: left; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 4px 8px rgba(0,0,0,0.3);}
        .movie-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .poster { width: 100%; height: 300px; object-fit: cover; background: #333;}
        .info { padding: 15px; }
        .title { font-size: 1.1em; font-weight: bold; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .meta { color: #aaa; font-size: 0.9em; display: flex; justify-content: space-between;}
        .rating { color: #f5c518; font-weight: bold; }
        .badge { background: #ff5722; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; margin-right: 5px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="header-bg">
        <h1 style="color: #ff5722;">🎬 SubDownloader</h1>
        <p style="color: #aaa;">Download subtitles in Malayalam and more.</p>
        <div class="search-box">
            <form action="/" method="GET" style="display: flex; width: 100%;">
                <input type="text" name="q" placeholder="Search for a movie or series..." value="{{ search_query }}">
                <button type="submit">Search</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="movie-grid">
            {% for media in media_list %}
                <a href="{% if media.media_type == 'series' %}/series/{{ media.title }}{% else %}/movie/{{ media.id }}{% endif %}" class="movie-card">
                    <img src="{{ media.poster_url }}" class="poster" alt="Poster">
                    <div class="info">
                        <div class="title">{{ media.title }}</div>
                        <div class="meta">
                            <span>
                                {% if media.media_type == 'series' %}
                                    <span class="badge">TV SERIES</span>
                                {% endif %}
                                {{ media.year }}
                            </span>
                            <span class="rating">★ {{ media.rating }}</span>
                        </div>
                    </div>
                </a>
            {% else %}
                <p style="text-align: center; grid-column: 1 / -1; color: #888;">No content found.</p>
            {% endfor %}
        </div>
    </div>
</body>
</html>
