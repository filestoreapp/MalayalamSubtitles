<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – Malayalam Subtitles Hub</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2956/2956785.png" type="image/png">
  <style>
    :root {
      --bg-primary: #0d0d0d; --bg-card: #1a1a1a; --accent: #e50914;
      --accent-hover: #c5000f; --border: #2a2a2a; --text-muted: #999;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-primary); color: #f0f0f0;
      font-family: 'Segoe UI', sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
    }
    .login-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem 2rem; width: min(400px, 100%);
      box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    .login-logo { text-align: center; margin-bottom: 1.75rem; }
    .login-logo .icon { font-size: 2.8rem; margin-bottom: .5rem; display: block; }
    .login-logo h1 { font-size: 1.3rem; font-weight: 800; }
    .login-logo p { color: var(--text-muted); font-size: .85rem; margin-top: .25rem; }
    .form-group { margin-bottom: 1rem; }
    .form-label { display: block; font-size: .78rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: .4rem; }
    .form-input {
      width: 100%; background: #111; border: 1px solid var(--border); color: #f0f0f0;
      border-radius: 10px; padding: .65rem 1rem; font-size: .95rem; transition: border-color .2s;
    }
    .form-input:focus { outline: none; border-color: var(--accent); background: #151515; }
    .login-btn {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: 10px; padding: .75rem; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .2s; margin-top: .5rem;
    }
    .login-btn:hover { background: var(--accent-hover); }
    .error-msg {
      background: rgba(229,9,20,.12); border: 1px solid rgba(229,9,20,.3);
      color: #ef9a9a; border-radius: 8px; padding: .65rem 1rem;
      font-size: .85rem; margin-bottom: 1rem; display: flex; align-items: center; gap: .5rem;
    }
    .back-link { display: block; text-align: center; margin-top: 1.25rem; color: var(--text-muted); text-decoration: none; font-size: .82rem; }
    .back-link:hover { color: #fff; }
    /* Input eye toggle */
    .pw-wrap { position: relative; }
    .pw-wrap .form-input { padding-right: 2.5rem; }
    .pw-toggle { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <span class="icon">🎬</span>
      <h1>Admin Login</h1>
      <p>Malayalam Subtitles Hub</p>
    </div>

    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input class="form-input" type="text" name="username" id="username"
               autocomplete="username" placeholder="admin" autofocus required>
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="pw-wrap">
          <input class="form-input" type="password" name="password" id="password"
                 autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="pw-toggle" onclick="togglePw()" title="Show/hide">👁</button>
        </div>
      </div>
      <button type="submit" class="login-btn">🔐 Sign In</button>
    </form>

    <a href="/" class="back-link">← Back to site</a>
  </div>

  <script>
  function togglePw() {
    const f = document.getElementById('password');
    f.type = f.type === 'password' ? 'text' : 'password';
  }
  document.querySelector('form').addEventListener('keypress', e => {
    if (e.key === 'Enter') e.currentTarget.submit();
  });
  </script>
</body>
</html>
