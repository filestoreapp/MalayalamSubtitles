<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body { background: #121212; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
        .box { background: #1f1f1f; padding: 40px; border-radius: 10px; width: 320px; text-align: center; color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 5px; border: none; background: #333; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff5722; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; font-size: 1.1em;}
        .error { color: #ff5252; font-size: 0.9em; margin-top: 10px; font-weight: bold;}
    </style>
</head>
<body>
    <div class="box">
        <h2>🔒 Admin Login</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <a href="/" style="color:#888; text-decoration:none; display:block; margin-top:20px; font-size:0.9em">&larr; Back to Site</a>
    </div>
</body>
</html>
