<!DOCTYPE html>
<html>
<head><title>Admin Upload</title></head>
<body style="font-family: Arial; padding: 20px;">
    <h2>Upload New Movie</h2>
    <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; width: 300px; gap: 10px;">
        <select name="media_type"><option value="movie">Movie</option></select>
        <input type="text" name="title" placeholder="Title" required>
        <input type="text" name="year" placeholder="Year">
        <input type="text" name="rating" placeholder="Rating (e.g. 8.5/10)">
        <input type="text" name="poster_url" placeholder="Poster Image URL" required>
        
        <label>Category / Genre:</label>
        <select name="category">
            <option value="Action">Action</option>
            <option value="Comedy">Comedy</option>
            <option value="Drama">Drama</option>
            <option value="Thriller">Thriller</option>
            <option value="Horror">Horror</option>
            <option value="Romance">Romance</option>
        </select>
        
        <label>Upload English .SRT</label>
        <input type="file" name="file" accept=".srt" required>
        <button type="submit" style="padding: 10px; background: green; color: white;">Upload to Database</button>
    </form>
    <br><a href="/dashboard">Back to Dashboard</a>
</body>
</html>
