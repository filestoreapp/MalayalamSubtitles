<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Upload Subtitles</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .upload-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .silent-box { background: #ffeaa7; padding: 10px; border-radius: 5px; border: 1px dashed #e1b12c; margin-top: 15px; margin-bottom: 15px; }
        button { background-color: #0984e3; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #74b9ff; }
    </style>
</head>
<body>

    <div class="upload-box">
        <h2>🎬 Upload New Subtitle</h2>
        <form action="/admin/upload" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Title:</label>
                <input type="text" name="title" placeholder="e.g., Tell Me Lies" required>
            </div>

            <div class="form-group">
                <label>Media Type:</label>
                <select name="media_type" required>
                    <option value="movie">Movie</option>
                    <option value="series">TV Series</option>
                </select>
            </div>

            <div class="form-group">
                <label>Season Number (Leave blank for movies):</label>
                <input type="number" name="season" placeholder="e.g., 1">
            </div>

            <div class="form-group">
                <label>Episode Number (Leave blank for movies):</label>
                <input type="number" name="episode" placeholder="e.g., 10">
            </div>

            <div class="form-group">
                <label>Rating (Out of 10):</label>
                <input type="text" name="rating" placeholder="e.g., 7.1" required>
            </div>

            <div class="form-group">
                <label>Category/Genre (Comma separated):</label>
                <input type="text" name="category" placeholder="e.g., Drama, Thriller" required>
            </div>

            <div class="form-group">
                <label>Poster Image URL:</label>
                <input type="text" name="poster_url" placeholder="https://..." required>
            </div>

            <div class="form-group">
                <label>Upload English .SRT File:</label>
                <input type="file" name="srt_file" accept=".srt" required>
            </div>

            <div class="form-group silent-box">
                <label style="color: #d63031; cursor: pointer;">
                    <input type="checkbox" name="silent_upload" value="yes"> 
                    🤫 <b>Silent Upload</b> (Check this to translate without posting to Telegram)
                </label>
            </div>

            <button type="submit">Upload & Start Translation</button>
        </form>
    </div>

</body>
</html>
