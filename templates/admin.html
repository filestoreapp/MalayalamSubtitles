<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Smart Upload</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
        .upload-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); max-width: 700px; margin: auto; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 12px; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        .optional-label { color: #7f8c8d; font-weight: normal; font-size: 0.85em; }
        .silent-box { background: #fff3cd; padding: 15px; border-radius: 6px; border: 1px dashed #ffeaa7; margin: 20px 0; }
        
        .episode-row { display: flex; gap: 15px; margin-bottom: 12px; align-items: center; background: white; padding: 12px; border: 1px solid #dee2e6; border-radius: 6px; }
        .episode-row input[type="number"] { width: 120px; }
        
        button { background-color: #0984e3; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #74b9ff; }
        
        .btn-add { background-color: #27ae60; width: auto; font-size: 14px; padding: 10px 20px; margin-top: 10px; }
        .btn-add:hover { background-color: #2ecc71; }
        
        .btn-autofill { background-color: #6c5ce7; width: auto; font-size: 14px; padding: 12px 20px; }
        .btn-autofill:hover { background-color: #a29bfe; }
        
        .header-link { display: inline-block; margin-bottom: 20px; color: #0984e3; text-decoration: none; font-weight: bold; }
        
        #tmdb-results { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .tmdb-result-btn { background: #f1f2f6; color: #2f3640; border: 1px solid #dcdde1; padding: 8px 12px; border-radius: 5px; text-align: left; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.2s; }
        .tmdb-result-btn:hover { background: #dfe4ea; border-color: #ced6e0; }
    </style>
</head>
<body>

    <div class="upload-box">
        <a href="/dashboard" class="header-link">← Back to Dashboard</a>
        <h2 style="margin-top: 0; color: #2c3e50;">🎬 Advanced Smart Upload</h2>
        
        <form action="/admin" method="POST" enctype="multipart/form-data">
            
            <div class="form-group">
                <label>Media Type:</label>
                <select name="media_type" id="media-type-select" required onchange="toggleMediaMode()">
                    <option value="movie">Movie</option>
                    <option value="series">TV Series (Batch Upload)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Title:</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" name="title" id="media-title" placeholder="e.g., The Matrix" required>
                    <button type="button" class="btn-autofill" onclick="fetchTMDB()">✨ Auto-Fill</button>
                </div>
                
                <div id="tmdb-results"></div>
                <small style="color: #7f8c8d; display: block; margin-top: 8px;">Type the title and click Auto-Fill to grab all data from TMDB instantly!</small>
            </div>

            <div class="form-group">
                <label>Plot Summary <span class="optional-label">(Optional)</span></label>
                <textarea name="plot" rows="3" placeholder="A brief description of the movie or show..."></textarea>
            </div>
            
            <div class="form-group" style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>Release Year:</label>
                    <input type="text" name="year" placeholder="e.g., 2024" required>
                </div>
                <div style="flex: 1;">
                    <label>Rating (Out of 10):</label>
                    <input type="text" name="rating" placeholder="e.g., 8.5" required>
                </div>
                <div style="flex: 1;">
                    <label>Runtime <span class="optional-label">(Optional)</span></label>
                    <input type="text" name="runtime" placeholder="e.g., 2h 15m">
                </div>
            </div>

            <div class="form-group">
                <label>Category/Genre (Comma separated):</label>
                <input type="text" name="category" placeholder="e.g., Action, Sci-Fi" required>
            </div>

            <div class="form-group">
                <label>Poster Image URL:</label>
                <input type="text" name="poster_url" placeholder="https://..." required>
            </div>

            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #e9ecef; margin-bottom: 20px;">
                <h3 style="margin-top:0; color: #2c3e50;">📥 Subtitle Source</h3>
                
                <div id="series-meta" style="display: none; gap: 15px; margin-bottom: 15px;">
                    <div style="flex: 1;">
                        <label>Season Number:</label>
                        <input type="number" name="season" id="season-input" placeholder="e.g., 1">
                    </div>
                    <div style="flex: 1;">
                        <label>Total Episodes to Fetch:</label>
                        <input type="number" id="total-eps-input" placeholder="e.g., 10">
                    </div>
                </div>

                <div id="fetched-srts-container"></div>
                <input type="hidden" id="hidden-imdb-id">

                <button type="button" id="fetch-srt-btn" onclick="autoFetchSRT()" style="background: #6c5ce7; margin-bottom: 15px;">✨ Auto-Fetch English Subtitles</button>
                <div id="fetch-status" style="font-size: 13px; margin-bottom: 20px; line-height: 1.6;"></div>

                <hr style="border: 0; border-top: 1px dashed #ced4da; margin: 20px 0;">

                <label style="color: #7f8c8d; font-size: 14px; margin-bottom: 10px;"><b>OR</b> Upload Manually (If API Fails):</label>
                <div id="episode-container" style="display: none;">
                    <div class="episode-row">
                        <input type="number" name="episodes[]" placeholder="Ep 1">
                        <input type="file" name="files[]" accept=".srt">
                    </div>
                </div>
                <div id="movie-manual-container">
                    <input type="file" name="files[]" accept=".srt">
                </div>
                
                <button type="button" id="add-ep-btn" class="btn-add" onclick="addEpisodeRow()" style="display: none;">➕ Add Another Manual Episode</button>
            </div>

            <div class="form-group silent-box">
                <label style="color: #d63031; cursor: pointer; margin: 0;">
                    <input type="checkbox" name="silent_upload" value="yes" style="width: auto;"> 
                    🤫 <b>Silent Upload</b> (Translate in background without posting to Telegram)
                </label>
            </div>

            <button type="submit">Upload & Start Processing</button>
        </form>
    </div>

    <script>
        const TMDB_API_KEY = "4f702e8358a2849df9d2aa4f6496a9e9"; 

        async function fetchTMDB() {
            const title = document.getElementById('media-title').value;
            const type = document.getElementById('media-type-select').value;
            const resultsBox = document.getElementById('tmdb-results');
            
            if(!title) { alert("Please type a movie or series title first!"); return; }
            
            resultsBox.innerHTML = '<span style="color: #0984e3; margin-top: 10px; display: inline-block;">Searching TMDB...</span>';
            const tmdbType = type === 'series' ? 'tv' : 'movie';
            const url = `https://api.themoviedb.org/3/search/${tmdbType}?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(title)}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                if(data.results && data.results.length > 0) {
                    resultsBox.innerHTML = ''; 
                    
                    data.results.slice(0, 5).forEach(item => {
                        const year = (item.release_date || item.first_air_date || 'N/A').substring(0, 4);
                        const displayTitle = item.title || item.name;
                        
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'tmdb-result-btn';
                        btn.innerHTML = `📌 ${displayTitle} (${year})`;
                        
                        btn.onclick = () => fetchSpecificDetails(item.id, tmdbType, displayTitle);
                        resultsBox.appendChild(btn);
                    });
                } else {
                    resultsBox.innerHTML = '<span style="color: #e74c3c; margin-top: 10px; display: inline-block;">No results found. Try checking the spelling!</span>';
                }
            } catch (e) {
                resultsBox.innerHTML = '<span style="color: #e74c3c; margin-top: 10px; display: inline-block;">Error connecting to TMDB.</span>';
            }
        }

        async function fetchSpecificDetails(tmdbId, tmdbType, exactTitle) {
            const resultsBox = document.getElementById('tmdb-results');
            resultsBox.innerHTML = '<span style="color: #0984e3; margin-top: 10px; display: inline-block;">Fetching details...</span>';
            
            try {
                const detailRes = await fetch(`https://api.themoviedb.org/3/${tmdbType}/${tmdbId}?api_key=${TMDB_API_KEY}`);
                const details = await detailRes.json();
                
                document.getElementById('media-title').value = exactTitle;
                document.getElementById('hidden-imdb-id').value = details.imdb_id;
                
                document.querySelector('textarea[name="plot"]').value = details.overview || '';
                document.querySelector('input[name="year"]').value = (details.release_date || details.first_air_date || '').substring(0, 4);
                document.querySelector('input[name="rating"]').value = (details.vote_average || 0).toFixed(1);
                
                if (details.poster_path) {
                    document.querySelector('input[name="poster_url"]').value = `https://image.tmdb.org/t/p/w500${details.poster_path}`;
                }
                
                const type = document.getElementById('media-type-select').value;
                if (type === 'movie' && details.runtime) {
                    const hours = Math.floor(details.runtime / 60);
                    const mins = details.runtime % 60;
                    document.querySelector('input[name="runtime"]').value = `${hours}h ${mins}m`;
                } else if (type === 'series' && details.episode_run_time && details.episode_run_time.length > 0) {
                    document.querySelector('input[name="runtime"]').value = `${details.episode_run_time[0]}m`;
                }
                
                if(details.genres) {
                    const genres = details.genres.map(g => g.name).join(', ');
                    document.querySelector('input[name="category"]').value = genres;
                }
                
                resultsBox.innerHTML = '<span style="color: #27ae60; font-weight: bold; margin-top: 10px; display: inline-block;">✅ Auto-Fill Complete!</span>';
                setTimeout(() => { resultsBox.innerHTML = ''; }, 3000); 
                
            } catch (e) {
                resultsBox.innerHTML = '<span style="color: #e74c3c; margin-top: 10px; display: inline-block;">Error fetching details.</span>';
            }
        }

        function toggleMediaMode() {
            const isSeries = document.getElementById('media-type-select').value === 'series';
            document.getElementById('series-meta').style.display = isSeries ? 'flex' : 'none';
            document.getElementById('add-ep-btn').style.display = isSeries ? 'block' : 'none';
            document.getElementById('episode-container').style.display = isSeries ? 'block' : 'none';
            document.getElementById('movie-manual-container').style.display = isSeries ? 'none' : 'block';
        }

        function addEpisodeRow() {
            const container = document.getElementById('episode-container');
            const newRow = document.createElement('div');
            newRow.className = 'episode-row';
            newRow.innerHTML = `<input type="number" name="episodes[]" placeholder="Ep ${container.children.length + 1}"> <input type="file" name="files[]" accept=".srt">`;
            container.appendChild(newRow);
        }

        async function autoFetchSRT() {
            const imdbId = document.getElementById('hidden-imdb-id').value;
            const mediaType = document.getElementById('media-type-select').value;
            const btn = document.getElementById('fetch-srt-btn');
            const statusBox = document.getElementById('fetch-status');
            const container = document.getElementById('fetched-srts-container');
            
            if (!imdbId) return alert("Please use the TMDB Auto-Fill first so we have the IMDb ID!");

            container.innerHTML = ''; 
            btn.disabled = true;

            if (mediaType === 'movie') {
                btn.innerText = "⏳ Fetching Movie...";
                statusBox.innerHTML = '<span style="color: #0984e3;">Searching databases (Subdl -> OpenSubtitles)...</span>';
                try {
                    const res = await fetch('/api/auto_fetch_srt', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({imdb_id: imdbId, media_type: 'movie'})
                    });
                    const data = await res.json();
                    if (data.success) {
                        container.innerHTML = `<textarea name="fetched_srts[]" style="display:none;">${data.srt_text}</textarea>
                                               <input type="hidden" name="fetched_episodes[]" value="1">`;
                        statusBox.innerHTML = `<span style="color: #27ae60; font-weight: bold;">✅ Captured from ${data.source}! Click "Upload & Start Processing" below.</span>`;
                        btn.innerText = "✅ Fetch Complete!";
                    } else {
                        statusBox.innerHTML = `<span style="color: #e74c3c;">❌ Error: ${data.error}</span>`;
                        btn.innerText = "✨ Auto-Fetch English Subtitles";
                    }
                } catch (e) {
                    statusBox.innerHTML = '<span style="color: #e74c3c;">❌ Network error.</span>';
                    btn.innerText = "✨ Auto-Fetch English Subtitles";
                }
            } else {
                const season = document.getElementById('season-input').value;
                const totalEps = document.getElementById('total-eps-input').value;
                
                if (!season || !totalEps) {
                    btn.disabled = false;
                    return alert("Please enter the Season and Total Episodes to Fetch!");
                }
                
                btn.innerText = `⏳ Fetching ${totalEps} Episodes...`;
                statusBox.innerHTML = '<b>Starting Batch Fetch...</b><br>';
                
                for (let i = 1; i <= totalEps; i++) {
                    statusBox.innerHTML += `<span style="color: #0984e3;">Fetching Ep ${i}... </span>`;
                    try {
                        const res = await fetch('/api/auto_fetch_srt', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({imdb_id: imdbId, media_type: 'series', season: season, episode: i})
                        });
                        const data = await res.json();
                        
                        if (data.success) {
                            statusBox.innerHTML += `<span style="color: #27ae60;">✅ Found (${data.source})</span><br>`;
                            container.innerHTML += `<textarea name="fetched_srts[]" style="display:none;">${data.srt_text}</textarea>
                                                   <input type="hidden" name="fetched_episodes[]" value="${i}">`;
                        } else {
                            statusBox.innerHTML += `<span style="color: #e74c3c;">❌ Failed</span><br>`;
                        }
                    } catch (e) {
                        statusBox.innerHTML += `<span style="color: #e74c3c;">❌ Network Error</span><br>`;
                    }
                }
                statusBox.innerHTML += `<br><span style="color: #27ae60; font-weight: bold;">🎉 Batch Process Complete! Click "Upload & Start Processing" below.</span>`;
                btn.innerText = "✅ Batch Fetch Complete!";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
